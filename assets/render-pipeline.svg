<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">SpinningCow rendering pipeline</title>
  <desc id="desc">Command-line settings feed frame setup. For each character cell, rays enter a signed-distance cow scene, surface points are shaded, and brightness becomes ASCII output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1012"/><stop offset="1" stop-color="#111b1b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152323"/><stop offset="1" stop-color="#10191b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#85cba0"/></marker>
    <style>
      .label{font:600 20px 'DejaVu Sans',Arial,sans-serif;fill:#e5eee8}
      .body{font:14px 'DejaVu Sans',Arial,sans-serif;fill:#9fb6ad}
      .num{font:700 13px 'DejaVu Sans',Arial,sans-serif;fill:#0b1012}
      .edge{fill:none;stroke:#85cba0;stroke-width:2;marker-end:url(#arrow)}
      .card{fill:url(#card);stroke:#324848;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1120" height="560" rx="18" fill="url(#bg)" stroke="#263b39"/>
  <text x="38" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#83b8a0">PER-FRAME PIPELINE</text>
  <text x="38" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#edf4ed">From distance fields to terminal characters</text>
  <g transform="translate(32,120)">
    <rect class="card" x="0" y="0" width="190" height="142" rx="12"/>
    <circle cx="22" cy="23" r="12" fill="#91d3a9"/><text class="num" x="22" y="28" text-anchor="middle">1</text>
    <text class="label" x="18" y="58">Frame setup</text>
    <text class="body" x="18" y="84"><tspan x="18" dy="0">Camera + light</tspan><tspan x="18" dy="22">Cow rotation</tspan><tspan x="18" dy="22">Tail movement</tspan></text>
    <rect class="card" x="228" y="0" width="190" height="142" rx="12"/>
    <circle cx="250" cy="23" r="12" fill="#91d3a9"/><text class="num" x="250" y="28" text-anchor="middle">2</text>
    <text class="label" x="246" y="58">Ray generation</text>
    <text class="body" x="246" y="84"><tspan x="246" dy="0">One cell at a time</tspan><tspan x="246" dy="22">Optional samples</tspan><tspan x="246" dy="22">per character</tspan></text>
    <rect class="card" x="456" y="0" width="190" height="142" rx="12"/>
    <circle cx="478" cy="23" r="12" fill="#91d3a9"/><text class="num" x="478" y="28" text-anchor="middle">3</text>
    <text class="label" x="474" y="58">Scene tracing</text>
    <text class="body" x="474" y="84"><tspan x="474" dy="0">SDF primitives</tspan><tspan x="474" dy="22">Bounding sphere</tspan><tspan x="474" dy="22">Sphere tracing</tspan></text>
    <rect class="card" x="684" y="0" width="190" height="142" rx="12"/>
    <circle cx="706" cy="23" r="12" fill="#91d3a9"/><text class="num" x="706" y="28" text-anchor="middle">4</text>
    <text class="label" x="702" y="58">Shading</text>
    <text class="body" x="702" y="84"><tspan x="702" dy="0">Normals + materials</tspan><tspan x="702" dy="22">Shadows + AO</tspan><tspan x="702" dy="22">Specular + rim light</tspan></text>
    <rect class="card" x="912" y="0" width="144" height="142" rx="12"/>
    <circle cx="934" cy="23" r="12" fill="#91d3a9"/><text class="num" x="934" y="28" text-anchor="middle">5</text>
    <text class="label" x="930" y="58">Output</text>
    <text class="body" x="930" y="84"><tspan x="930" dy="0">Brightness</tspan><tspan x="930" dy="22">to glyphs</tspan><tspan x="930" dy="22">ANSI colour</tspan></text>
    <path class="edge" d="M190 70 H220"/><path class="edge" d="M418 70 H448"/><path class="edge" d="M646 70 H676"/><path class="edge" d="M874 70 H904"/>
  </g>
  <text x="38" y="318" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#83b8a0">DETAILS THAT MAKE THE SHAPE</text>
  <g transform="translate(32,342)">
    <rect x="0" y="0" width="250" height="146" rx="12" fill="#10191b" stroke="#324848"/>
    <text class="label" x="18" y="33">Distance-field geometry</text><text class="body" x="18" y="61"><tspan x="18">Rounded boxes, ellipsoids and</tspan><tspan x="18" dy="21">tapered capsules combine into</tspan><tspan x="18" dy="21">one continuous cow surface.</tspan></text>
    <rect x="270" y="0" width="250" height="146" rx="12" fill="#10191b" stroke="#324848"/>
    <text class="label" x="288" y="33">Procedural coat</text><text class="body" x="288" y="61"><tspan x="288">Deterministic value noise warps</tspan><tspan x="288" dy="21">overlapping blobs into irregular</tspan><tspan x="288" dy="21">Holstein-style spots.</tspan></text>
    <rect x="540" y="0" width="250" height="146" rx="12" fill="#10191b" stroke="#324848"/>
    <text class="label" x="558" y="33">Approximate lighting</text><text class="body" x="558" y="61"><tspan x="558">The renderer estimates surface</tspan><tspan x="558" dy="21">normals from nearby distance</tspan><tspan x="558" dy="21">samples, then shades each hit.</tspan></text>
    <rect x="810" y="0" width="246" height="146" rx="12" fill="#10191b" stroke="#324848"/>
    <text class="label" x="828" y="33">Sampling trade-off</text><text class="body" x="828" y="61"><tspan x="828">SS = 1 is faster. SS = 2 casts</tspan><tspan x="828" dy="21">four rays per character to soften</tspan><tspan x="828" dy="21">edges and small details.</tspan></text>
  </g>
</svg>